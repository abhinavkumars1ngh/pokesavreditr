name: Build Switch app

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install asset tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil
      - name: Fetch required fonts and artwork
        run: |
          python3 tools/gen_fonts.py
          python3 tools/gen_typeicons.py
          python3 tools/gen_marks.py
          python3 tools/gen_ribbons.py
          python3 tools/gen_hdsprites.py
      - name: Build production homebrew
        run: make -j2
      - name: Package Switch download
        run: |
          mkdir -p dist/switch/switch/pokesavreditr
          cp pokesavreditr.nro dist/switch/switch/pokesavreditr/
          cp docs/SWITCH-INSTALL.md dist/switch/README.md
          cp LICENSE NOTICE.md dist/switch/
          sha256sum pokesavreditr.nro > dist/switch/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > dist/switch/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokesavreditr-switch
          path: dist/switch/
          if-no-files-found: error
          compression-level: 6
